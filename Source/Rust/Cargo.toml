[package]
name = "panevanta"
version = "0.9.7"
edition = "2024"

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
libloading = "0.8"
windows = { version = "0.61", features = [
    "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Foundation",
    "Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader",
    "Win32_System_Performance", "Win32_System_Threading", "Win32_Security",
    "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse"
] }
